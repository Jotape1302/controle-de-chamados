# Perfil de produção: PostgreSQL e configuração 100% via variáveis de ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Atrás de proxy reverso (Nginx): respeita X-Forwarded-*
server.forward-headers-strategy=framework

# Swagger desligado por padrão em produção
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

logging.level.root=INFO

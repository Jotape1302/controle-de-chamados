# Perfil de desenvolvimento local: H2 em arquivo, dados de exemplo e console H2.
spring.datasource.url=jdbc:h2:file:./data/ticketsdb;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Segredo APENAS para desenvolvimento. Nunca use este valor fora da sua máquina.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

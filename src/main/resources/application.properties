spring.application.name=homeney-tickets
server.port=${SERVER_PORT:8080}

# Perfil padrão quando nenhum for informado (SPRING_PROFILES_ACTIVE)
spring.profiles.default=dev

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console fica desligado por padrão; o perfil dev o habilita apenas para localhost
spring.h2.console.enabled=false

# Segurança / JWT
# O segredo precisa ter pelo menos 32 bytes (HS256). Em produção, defina JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration=${JWT_EXPIRATION:PT8H}
app.security.jwt.issuer=homeney-tickets

# CORS: lista separada por vírgula. Vazio = nenhuma origem externa liberada.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
